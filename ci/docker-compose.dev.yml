name: quiz-dev

services:
  api:
    build:
      context: ..
      dockerfile: ./ci/docker/Dockerfile.dev
    container_name: quiz_api_dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-quizuser}:${POSTGRES_PASSWORD:-quizpass}@host.docker.internal:5433/${POSTGRES_DB:-quiz_db_dev}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-harinezumi-quiz-web}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
      SES_FROM_NAME: ${SES_FROM_NAME}
      SES_REPLY_TO: ${SES_REPLY_TO}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "8001:8001"
    volumes:
      - ..:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quiz_network_dev
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"

networks:
  quiz_network_dev:
    driver: bridge
