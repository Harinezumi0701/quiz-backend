[tool.poetry]
name = "quiz"
version = "0.1.0"
description = ""
authors = ["Nhim0701 <hieunguyen.hari0701@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.120.4"
uvicorn = "^0.38.0"
sqlalchemy = "^2.0.44"
psycopg2 = "^2.9.11"
alembic = "^1.17.1"
python-dotenv = "^1.2.1"
pyyaml = "^6.0.3"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.0.1"
python-multipart = "^0.0.6"
email-validator = "^2.0.0"
boto3 = "^1.35.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.4.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI uses Depends/Query/Body in argument defaults by design
    "B904",   # raise-without-from-inside-except: existing codebase pattern
    "UP046",  # Generic[T] subclass syntax: existing Pydantic pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"alembic/env.py" = ["F401", "I001"]      # Model imports are intentional for autogenerate
"app/constants/__init__.py" = ["F403"]   # Wildcard re-exports are intentional
"app/models/__init__.py" = ["F401"]      # Model re-exports for SQLAlchemy mapper registration
"app/db/base.py" = ["E402"]             # Import order intentional for side-effect registration
"app/main.py" = ["E402"]               # Middleware/exception imports ordered by setup sequence
"app/utils/search_pagination.py" = ["E712"]   # SQLAlchemy column == True/False is correct ORM syntax
"app/repository/role_repo.py" = ["E712"]      # SQLAlchemy boolean filter
"app/repository/submission_repo.py" = ["E712"] # SQLAlchemy boolean filter in case()
"app/services/auth_service.py" = ["F821"]     # ERROR_* constants come from wildcard import (F403)
"app/services/role_service.py" = ["F841"]     # Fetch-to-validate pattern (raises if not found)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
